[project]
name = "multi-agent-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "siddharth-coded", email = "siddharth2411097@akgec.ac.in" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "html5lib>=1.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "lxml>=6.1.1",
    "mistralai>=2.9.1",
    "orjson>=3.11.9",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "streamlit>=1.61.1",
    "tavily-python>=0.7.27",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
multi-agent-system = "multi_agent_system:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
